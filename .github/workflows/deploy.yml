name: Build & Deploy get-all-payments to EC2

on:
  push:
    branches:
      - qa
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build, Push to DockerHub and Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set deployment variables
        id: set-vars
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/qa" ]]; then
            echo "env=QA" >> $GITHUB_OUTPUT
            echo "tag=qa-latest" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event.pull_request.base.ref }}" == "main" ]]; then
            echo "env=PROD" >> $GITHUB_OUTPUT
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t kalemat/27-get-all-payments:${{ steps.set-vars.outputs.tag }} .

      - name: Push Docker image to Docker Hub
        run: |
          docker push kalemat/27-get-all-payments:${{ steps.set-vars.outputs.tag }}

      - name: Connect and deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets[format('EC2_HOST_{0}', steps.set-vars.outputs.env)] }}
          username: ${{ secrets[format('EC2_USER_{0}', steps.set-vars.outputs.env)] }}
          key: ${{ secrets[format('EC2_KEY_{0}', steps.set-vars.outputs.env)] }}
          port: 22
          timeout: 30s
          command_timeout: 10m
          script: |
            docker stop 27-get-all-payments || true
            docker rm 27-get-all-payments || true

            docker pull kalemat/27-get-all-payments:${{ steps.set-vars.outputs.tag }}

            echo "PORT=3067" > .env
            echo "MONGO_URI=${{ secrets.MONGO_URI }}" >> .env
            echo "DB_NAME=payments_db" >> .env
            echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" >> .env

            docker run -d \
              --name 27-get-all-payments \
              --restart always \
              --env-file .env \
              -p 3067:3067 \
              kalemat/27-get-all-payments:${{ steps.set-vars.outputs.tag }}
